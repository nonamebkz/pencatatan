services:
  mysql:
    image: mysql:8.4
    container_name: pencatatan-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-pencatatan}
      MYSQL_USER: ${DB_USER:-pencatatan}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pencatatan}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USER:-pencatatan}", "-p${DB_PASSWORD:-pencatatan}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pencatatan-backend
    restart: unless-stopped
    environment:
      APP_PORT: ${APP_PORT:-8080}
      DB_HOST: mysql
      DB_PORT: ${DB_INTERNAL_PORT:-3306}
      DB_USER: ${DB_USER:-pencatatan}
      DB_PASSWORD: ${DB_PASSWORD:-pencatatan}
      DB_NAME: ${DB_NAME:-pencatatan}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-3000},http://localhost:${FRONTEND_DEV_PORT:-5173}}
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api/v1}
    container_name: pencatatan-frontend
    restart: unless-stopped
    environment:
      APP_PORT: ${APP_PORT:-8080}
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_CONTAINER_PORT:-80}"
    depends_on:
      - backend

volumes:
  mysql_data:
